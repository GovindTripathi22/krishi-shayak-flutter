name: krishisahayak
description: "KrishiSahayak - AI-Powered Agricultural Assistant for Farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core & Firebase Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  firebase_app_check: ^0.3.0
  firebase_crashlytics: ^4.0.1
  firebase_remote_config: ^5.0.1
  firebase_vertexai: ^1.0.0

  # AI & Machine Learning (OCR, Speech & Voice)
  google_mlkit_text_recognition: ^0.13.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Networking
  http: ^1.2.0

  # Media & File Picker
  file_picker: ^8.0.3
  image_picker: ^1.1.1

  # State Management & DI
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0

  # Routing
  go_router: ^13.2.0

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  intl: ^0.19.0

  # Device, Security & Storage
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.1.2
  logger: ^2.3.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/images/
    - assets/animations/
    - assets/lottie/
